<svg xmlns="http://www.w3.org/2000/svg" width="840" height="210" viewBox="0 0 840 210" role="img" aria-labelledby="title desc">
  <title id="title">Piotr Olszewski / asmie</title>
  <desc id="desc">Software engineer. Algorithms, systems, and machine learning. A highlighted route through a graph on a dark green background.</desc>
